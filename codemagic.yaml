workflows:
  ios-production:
    name: Ekitapligim iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Ekitapligim Codemagic 3"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: 26.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ekitapligim.app
      vars:
        APP_STORE_APPLE_ID: "6789584323"
        APPLE_TEAM_ID: "QA67383767"
        XCODE_PROJECT: "Ekitapligim.xcodeproj"
        XCODE_SCHEME: "Ekitapligim"
        XCODE_CONFIGURATION: "Production"

    scripts:
      - name: Install xcodegen if missing
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew update
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          echo "Building revision: $(git rev-parse --short HEAD)"
          xcodegen generate

      - name: Synchronize Push Notifications signing capability
        script: |
          set -euo pipefail
          BUNDLE_ID="com.ekitapligim.app"
          SIGNING_DIR="$CM_BUILD_DIR/build/push-signing"
          mkdir -p "$SIGNING_DIR/profiles" "$SIGNING_DIR/certificates"
          BUNDLE_IDS_JSON=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json)
          BUNDLE_RESOURCE_ID=$(printf '%s' "$BUNDLE_IDS_JSON" | jq -r --arg identifier "$BUNDLE_ID" '
            (if type == "array" then . else (.data // [.] ) end)
            | map(select((.attributes.identifier // .identifier) == $identifier))
            | first
            | .id // empty
          ')
          if [ -z "$BUNDLE_RESOURCE_ID" ]; then
            echo "Could not resolve Apple bundle ID resource for $BUNDLE_ID"
            exit 1
          fi
          CAPABILITIES_JSON=$(app-store-connect bundle-ids capabilities "$BUNDLE_RESOURCE_ID" --json)
          if ! printf '%s' "$CAPABILITIES_JSON" | grep -Eq 'PUSH_NOTIFICATIONS|Push Notifications'; then
            app-store-connect bundle-ids enable-capabilities \
              "$BUNDLE_RESOURCE_ID" \
              --capability "Push Notifications"
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --profiles-dir "$SIGNING_DIR/profiles" \
            --certificates-dir "$SIGNING_DIR/certificates"

      - name: Configure App Store code signing
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          echo "Available Apple signing identities:"
          security find-identity -v -p codesigning || true
          xcode-project use-profiles \
            --profile "$CM_BUILD_DIR/build/push-signing/profiles/*.mobileprovision" \
            --archive-method app-store 2>&1 | tee "$CM_BUILD_DIR/build/configure-code-signing.log"

      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

      - name: Verify Production Google Sign-In settings
        script: |
          set -euo pipefail
          SETTINGS_FILE="$CM_BUILD_DIR/build/production-build-settings.log"
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" > "$SETTINGS_FILE"
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = com\.ekitapligim\.app$' "$SETTINGS_FILE"
          grep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_IOS_CLIENT_ID = 258534406055-trcoiet648ohvijagtpli1h1556i2cjq\.apps\.googleusercontent\.com$' "$SETTINGS_FILE"
          grep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_SERVER_CLIENT_ID = 258534406055-v8lmgd6moijakv1kcurgit788uk5v2el\.apps\.googleusercontent\.com$' "$SETTINGS_FILE"
          grep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_URL_SCHEME = com\.googleusercontent\.apps\.258534406055-trcoiet648ohvijagtpli1h1556i2cjq$' "$SETTINGS_FILE"
          grep -Eq '^[[:space:]]*EKITAPLIGIM_API_BASE_URL = https://ekitapligim\.com/ios-api/v1/$' "$SETTINGS_FILE"

      - name: Compile app tests for iPhone and iPad
        script: |
          set -euo pipefail
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/build/show-build-settings.log"
          echo "Compiling the complete XCTest bundle for the generic iOS Simulator."
          echo "GitHub CI runs the same revision on dedicated iPhone and iPad simulator runtimes; Codemagic Xcode 26.3 is used for signed App Store archives."
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Development \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO 2>&1 | tee "$CM_BUILD_DIR/build/compile-tests.log"

      - name: Increment App Store build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions)
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid TestFlight build number: $LATEST_BUILD_NUMBER"
            exit 1
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Using App Store build number: $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build IPA for TestFlight
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/build/build-ipa.log"

    artifacts:
      - build/**/*
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - acarsamsung37@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
