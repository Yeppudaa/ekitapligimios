workflows:
  ios-production:
    name: Ekitapligim iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Ekitapligim Codemagic 3"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: 26.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ekitapligim.app
      vars:
        APP_STORE_APPLE_ID: "6789584323"
        APPLE_TEAM_ID: "QA67383767"
        XCODE_PROJECT: "Ekitapligim.xcodeproj"
        XCODE_SCHEME: "Ekitapligim"
        XCODE_CONFIGURATION: "Production"

    scripts:
      - name: Install xcodegen if missing
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew update
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          echo "Building revision: $(git rev-parse --short HEAD)"
          xcodegen generate

      - name: Configure App Store code signing
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          echo "Available Apple signing identities:"
          security find-identity -v -p codesigning || true
          xcode-project use-profiles 2>&1 | tee "$CM_BUILD_DIR/build/configure-code-signing.log"

      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

      - name: Run app tests
        script: |
          set -euo pipefail
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/build/show-build-settings.log"
          SIMULATOR_UDID=$(xcrun simctl list devices available | sed -nE '/iPhone/ { s/.*\(([0-9A-F-]{36})\).*/\1/p; q; }' || true)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No iPhone simulator runtime is installed on this Codemagic image."
            echo "Compiling the complete test bundle for a generic iOS Simulator; GitHub CI executes the tests on real iPhone and iPad simulator runtimes."
            xcodebuild build-for-testing \
              -quiet \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Development \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGNING_ALLOWED=NO \
              SWIFT_COMPILATION_MODE=singlefile \
              SWIFT_ENABLE_BATCH_MODE=NO 2>&1 | tee "$CM_BUILD_DIR/build/compile-tests.log"
            exit 0
          fi
          echo "Running tests on iPhone simulator $SIMULATOR_UDID"
          if ! xcodebuild test \
            -quiet \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Development \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$CM_BUILD_DIR/build/EkitapligimTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO 2>&1 | tee "$CM_BUILD_DIR/build/run-app-tests.log"; then
            echo "xcodebuild test failed"
            echo "---- run-app-tests.log: error summary ----"
            grep -nEi "error:|fatal error|testing failed|test failed|no such module|cannot find|could not|unable to|codesign|provision" "$CM_BUILD_DIR/build/run-app-tests.log" || true
            echo "---- run-app-tests.log: last 200 lines ----"
            tail -n 200 "$CM_BUILD_DIR/build/run-app-tests.log"
            exit 65
          fi

      - name: Run iPad app tests
        script: |
          set -euo pipefail
          set -o pipefail
          IPAD_SIMULATOR_UDID=$(xcrun simctl list devices available | sed -nE '/iPad/ { s/.*\(([0-9A-F-]{36})\).*/\1/p; q; }' || true)
          if [ -z "$IPAD_SIMULATOR_UDID" ]; then
            echo "No iPad simulator runtime is installed on this Codemagic image. GitHub CI executes the iPad test suite; the preceding step compiled the complete test bundle."
            exit 0
          fi
          echo "Running tests on iPad simulator $IPAD_SIMULATOR_UDID"
          if ! xcodebuild test \
            -quiet \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Development \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR_UDID" \
            -resultBundlePath "$CM_BUILD_DIR/build/EkitapligimTests-iPad.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO 2>&1 | tee "$CM_BUILD_DIR/build/run-ipad-tests.log"; then
            echo "iPad xcodebuild test failed"
            grep -nEi "error:|fatal error|testing failed|test failed|no such module|cannot find|could not|unable to|codesign|provision" "$CM_BUILD_DIR/build/run-ipad-tests.log" || true
            tail -n 200 "$CM_BUILD_DIR/build/run-ipad-tests.log"
            exit 65
          fi

      - name: Increment App Store build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions)
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid TestFlight build number: $LATEST_BUILD_NUMBER"
            exit 1
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Using App Store build number: $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build IPA for TestFlight
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/build/build-ipa.log"

    artifacts:
      - build/**/*
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - acarsamsung37@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
