workflows:
  ios-modern-parity-validation:
    name: Ekitapligim iOS Modern Parity Validation
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
      - push
      branch_patterns:
      - pattern: codex/android-ios-design-audio-20261017
        include: true
        source: true
      cancel_previous_builds: false
    environment:
      xcode: 26.3
    cache:
      cache_paths:
      - .build/xcode-packages
    scripts:
    - name: Native iPhone and iPad tests, screenshots and unsigned Production build
      script: bash Scripts/modern-parity-macos-validation.sh
    artifacts:
    - build/modern-parity-archives/modern-parity-evidence.zip
    - build/modern-parity-archives/forensics/*.xcresult.zip
    - build/modern-parity-archives/packaging-status.json
    - build/modern-parity-packaging.log
  ios-native-audio-diagnostic:
    name: Ekitapligim iOS Native Audio Diagnostic
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      xcode: 26.3
    cache:
      cache_paths:
      - .build/xcode-packages
    scripts:
    - name: Native audio control and teardown diagnostics
      script: bash Scripts/native-audio-macos-diagnostic.sh
    artifacts:
    - build/native-audio-archives/modern-parity-evidence.zip
    - build/native-audio-archives/forensics/*.xcresult.zip
    - build/native-audio-archives/packaging-status.json
    - build/native-audio-packaging.log
  ios-audio-detail-scroll-diagnostic:
    name: Ekitapligim iOS Audio Detail Scroll Diagnostic
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 26.3
    cache:
      cache_paths:
      - .build/xcode-packages
    scripts:
    - name: Two actual audio detail scroll tests with selected-app stack samples
      script: bash Scripts/audio-detail-scroll-macos-diagnostic.sh
    artifacts:
    - build/audio-detail-scroll-archives/modern-parity-evidence.zip
    - build/audio-detail-scroll-archives/forensics/*.xcresult.zip
    - build/audio-detail-scroll-archives/packaging-status.json
    - build/audio-detail-scroll-packaging.log
  ios-focused-visual-regression:
    name: Ekitapligim iOS Focused Visual Regression
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      xcode: 26.3
    cache:
      cache_paths:
      - .build/xcode-packages
    scripts:
    - name: Nine selected UI regressions on three device sizes
      script: bash Scripts/focused-visual-macos-regression.sh
    artifacts:
    - build/focused-visual-regression-archives/modern-parity-evidence.zip
    - build/focused-visual-regression-archives/forensics/*.xcresult.zip
    - build/focused-visual-regression-archives/packaging-status.json
    - build/focused-visual-regression-packaging.log
  ios-production:
    name: Ekitapligim iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ekitapligim Codemagic 3
    triggering:
      events:
      - push
      branch_patterns:
      - pattern: master
        include: true
        source: true
      - pattern: codex/ai-assistant-validation-20260906
        include: true
        source: true
      - pattern: codex/premium-giftwheel-testflight
        include: true
        source: true
      cancel_previous_builds: true
    environment:
      xcode: 26.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ekitapligim.app
      vars:
        APP_STORE_APPLE_ID: '6789584323'
        APPLE_TEAM_ID: QA67383767
        XCODE_PROJECT: Ekitapligim.xcodeproj
        XCODE_SCHEME: Ekitapligim
        XCODE_CONFIGURATION: Production
    scripts:
    - name: Install xcodegen if missing
      script: "if ! command -v xcodegen >/dev/null 2>&1; then\n  brew update\n  brew install xcodegen\nfi\n"
    - name: Generate Xcode project
      script: 'echo "Building revision: $(git rev-parse --short HEAD)"

        xcodegen generate

        '
    - name: Synchronize Push Notifications signing capability
      script: "set -euo pipefail\nBUNDLE_ID=\"com.ekitapligim.app\"\nSIGNING_DIR=\"$CM_BUILD_DIR/build/push-signing\"\nmkdir -p \"$SIGNING_DIR/profiles\"\nBUNDLE_IDS_JSON=$(app-store-connect bundle-ids list \\\n  --bundle-id-identifier \"$BUNDLE_ID\" \\\n  --strict-match-identifier \\\n  --json)\nBUNDLE_RESOURCE_ID=$(printf '%s' \"$BUNDLE_IDS_JSON\" | jq -r --arg identifier \"$BUNDLE_ID\" '\n  (if type == \"array\" then . else (.data // [.] ) end)\n  | map(select((.attributes.identifier // .identifier) == $identifier))\n  | first\n  | .id // empty\n')\nif [ -z \"$BUNDLE_RESOURCE_ID\" ]; then\n  echo \"Could not resolve Apple bundle ID resource for $BUNDLE_ID\"\n  exit 1\nfi\nCAPABILITIES_JSON=$(app-store-connect bundle-ids capabilities \"$BUNDLE_RESOURCE_ID\" --json)\nif ! printf '%s' \"$CAPABILITIES_JSON\" | grep -Eq 'PUSH_NOTIFICATIONS|Push Notifications'; then\n  app-store-connect bundle-ids enable-capabilities \\\n    \"$BUNDLE_RESOURCE_ID\" \\\n    --capability \"Push Notifications\"\
        \nfi\nCERTIFICATES_JSON=$(app-store-connect certificates list \\\n  --profile-type IOS_APP_STORE \\\n  --json)\nCERTIFICATE_RESOURCE_IDS=()\nwhile IFS= read -r CERTIFICATE_RESOURCE_ID; do\n  if [ -n \"$CERTIFICATE_RESOURCE_ID\" ]; then\n    CERTIFICATE_RESOURCE_IDS+=(\"$CERTIFICATE_RESOURCE_ID\")\n  fi\ndone < <(printf '%s' \"$CERTIFICATES_JSON\" | jq -r '\n  (if type == \"array\" then . else (.data // [.] ) end)\n  | map(.id // empty)\n  | .[]\n')\nif [ \"${#CERTIFICATE_RESOURCE_IDS[@]}\" -eq 0 ]; then\n  echo \"Could not resolve an Apple Distribution certificate for App Store signing\"\n  exit 1\nfi\nPROFILE_NAME=\"Ekitapligim App Store Push ${CM_BUILD_ID}\"\napp-store-connect profiles create \"$BUNDLE_RESOURCE_ID\" \\\n  --certificate-ids \"${CERTIFICATE_RESOURCE_IDS[@]}\" \\\n  --type IOS_APP_STORE \\\n  --name \"$PROFILE_NAME\" \\\n  --save \\\n  --profiles-dir \"$SIGNING_DIR/profiles\"\n"
    - name: Configure App Store code signing
      script: "set -euo pipefail\nmkdir -p \"$CM_BUILD_DIR/build\"\nXCODE_PROFILES_DIR=\"$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles\"\nLEGACY_PROFILES_DIR=\"$HOME/Library/MobileDevice/Provisioning Profiles\"\nmkdir -p \"$XCODE_PROFILES_DIR\" \"$LEGACY_PROFILES_DIR\"\ncp \"$CM_BUILD_DIR\"/build/push-signing/profiles/*.mobileprovision \"$XCODE_PROFILES_DIR/\"\ncp \"$CM_BUILD_DIR\"/build/push-signing/profiles/*.mobileprovision \"$LEGACY_PROFILES_DIR/\"\necho \"Available Apple signing identities:\"\nsecurity find-identity -v -p codesigning || true\nxcode-project use-profiles \\\n  --profile \"$CM_BUILD_DIR/build/push-signing/profiles/*.mobileprovision\" \\\n  --archive-method app-store 2>&1 | tee \"$CM_BUILD_DIR/build/configure-code-signing.log\"\n"
    - name: Resolve Swift Package dependencies
      script: 'xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

        '
    - name: Verify Production Google Sign-In settings
      script: "set -euo pipefail\nSETTINGS_FILE=\"$CM_BUILD_DIR/build/production-build-settings.log\"\nmkdir -p \"$CM_BUILD_DIR/build\"\nxcodebuild -showBuildSettings \\\n  -project \"$XCODE_PROJECT\" \\\n  -scheme \"$XCODE_SCHEME\" \\\n  -configuration \"$XCODE_CONFIGURATION\" > \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = com\\.ekitapligim\\.app$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_IOS_CLIENT_ID = 258534406055-trcoiet648ohvijagtpli1h1556i2cjq\\.apps\\.googleusercontent\\.com$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_SERVER_CLIENT_ID = 258534406055-v8lmgd6moijakv1kcurgit788uk5v2el\\.apps\\.googleusercontent\\.com$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_URL_SCHEME = com\\.googleusercontent\\.apps\\.258534406055-trcoiet648ohvijagtpli1h1556i2cjq$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_API_BASE_URL = https://ekitapligim\\.com/ios-api/v1/$' \"$SETTINGS_FILE\"\n"
    - name: Compile app tests for iPhone and iPad
      script: "set -euo pipefail\nset -o pipefail\nmkdir -p \"$CM_BUILD_DIR/build\"\nxcodebuild -showBuildSettings \\\n  -project \"$XCODE_PROJECT\" \\\n  -scheme \"$XCODE_SCHEME\" 2>&1 | tee \"$CM_BUILD_DIR/build/show-build-settings.log\"\necho \"Compiling the complete XCTest bundle for the generic iOS Simulator.\"\necho \"GitHub CI runs the same revision on dedicated iPhone and iPad simulator runtimes; Codemagic Xcode 26.3 is used for signed App Store archives.\"\nxcodebuild build-for-testing \\\n  -project \"$XCODE_PROJECT\" \\\n  -scheme \"$XCODE_SCHEME\" \\\n  -configuration Development \\\n  -destination \"generic/platform=iOS Simulator\" \\\n  CODE_SIGNING_ALLOWED=YES \\\n  CODE_SIGN_IDENTITY=- \\\n  CODE_SIGN_STYLE=Manual \\\n  CODE_SIGN_ENTITLEMENTS=\"$CM_BUILD_DIR/Scripts/ci-simulator.entitlements\" \\\n  SWIFT_COMPILATION_MODE=singlefile \\\n  SWIFT_ENABLE_BATCH_MODE=NO 2>&1 | tee \"$CM_BUILD_DIR/build/compile-tests.log\"\n"
    - name: Run iOS unit and UI tests
      script: "set -euo pipefail\nSIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r '\n  [.devices[][] | select(.isAvailable == true and (.name | startswith(\"iPhone\")))]\n  | first | .udid // empty\n')\nif [ -z \"$SIMULATOR_ID\" ]; then\n  echo \"No available iPhone simulator for unit and UI tests.\"\n  exit 1\nfi\necho \"Testing on iPhone simulator $SIMULATOR_ID\"\nxcodebuild test-without-building \\\n  -project \"$XCODE_PROJECT\" \\\n  -scheme \"$XCODE_SCHEME\" \\\n  -configuration Development \\\n  -destination \"platform=iOS Simulator,id=$SIMULATOR_ID\" \\\n  -resultBundlePath \"$CM_BUILD_DIR/build/ios-tests.xcresult\" \\\n  CODE_SIGNING_ALLOWED=YES \\\n  CODE_SIGN_IDENTITY=- \\\n  CODE_SIGN_STYLE=Manual \\\n  CODE_SIGN_ENTITLEMENTS=\"$CM_BUILD_DIR/Scripts/ci-simulator.entitlements\" \\\n  SWIFT_COMPILATION_MODE=singlefile \\\n  SWIFT_ENABLE_BATCH_MODE=NO 2>&1 | tee \"$CM_BUILD_DIR/build/ios-tests.log\"\n"
    - name: Increment App Store build number
      script: "set -euo pipefail\nLATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \"$APP_STORE_APPLE_ID\" --platform IOS --all-versions)\nif ! [[ \"$LATEST_BUILD_NUMBER\" =~ ^[0-9]+$ ]]; then\n  echo \"Invalid TestFlight build number: $LATEST_BUILD_NUMBER\"\n  exit 1\nfi\nNEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))\necho \"Using App Store build number: $NEXT_BUILD_NUMBER\"\nagvtool new-version -all \"$NEXT_BUILD_NUMBER\"\n"
    - name: Build IPA for TestFlight
      script: "set -euo pipefail\nxcode-project build-ipa \\\n  --project \"$CM_BUILD_DIR/$XCODE_PROJECT\" \\\n  --scheme \"$XCODE_SCHEME\" 2>&1 | tee \"$CM_BUILD_DIR/build/build-ipa.log\"\n"
    - name: Verify signed Production push entitlement
      script: "set -euo pipefail\nIPA_PATH=$(find \"$CM_BUILD_DIR/build/ios/ipa\" -maxdepth 1 -name '*.ipa' -print -quit)\nif [ -z \"$IPA_PATH\" ]; then\n  echo \"No IPA was produced for entitlement verification.\"\n  exit 1\nfi\nVERIFY_DIR=$(mktemp -d)\ntrap 'rm -rf \"$VERIFY_DIR\"' EXIT\nunzip -q \"$IPA_PATH\" -d \"$VERIFY_DIR\"\nAPP_PATH=$(find \"$VERIFY_DIR/Payload\" -maxdepth 1 -name '*.app' -type d -print -quit)\nif [ -z \"$APP_PATH\" ]; then\n  echo \"Signed application bundle was not found in the IPA.\"\n  exit 1\nfi\ncodesign -d --entitlements :- \"$APP_PATH\" > \"$CM_BUILD_DIR/build/production-entitlements.plist\" 2>/dev/null\nPUSH_ENVIRONMENT=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' \"$CM_BUILD_DIR/build/production-entitlements.plist\")\nif [ \"$PUSH_ENVIRONMENT\" != \"production\" ]; then\n  echo \"Invalid signed aps-environment: $PUSH_ENVIRONMENT\"\n  exit 1\nfi\necho \"Signed IPA uses the production APNs environment.\"\n"
    artifacts:
    - build/**/*
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
        - acarsamsung37@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
  ios-testflight-reviewed:
    name: Ekitapligim iOS Reviewed TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ekitapligim Codemagic 3
    environment:
      xcode: 26.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ekitapligim.app
      vars:
        APP_STORE_APPLE_ID: '6789584323'
        APPLE_TEAM_ID: QA67383767
        XCODE_PROJECT: Ekitapligim.xcodeproj
        XCODE_SCHEME: Ekitapligim
        XCODE_CONFIGURATION: Production
    cache:
      cache_paths:
      - .build/xcode-packages
    scripts:
    - name: Require the exact reviewed application source
      script: python3 Scripts/testflight-reviewed-gate.py
    - name: Install xcodegen if missing
      script: "if ! command -v xcodegen >/dev/null 2>&1; then\n  brew update\n  brew install xcodegen\nfi\n"
    - name: Generate project and retain reviewed production entitlements
      script: 'set -euo pipefail

        xcodegen generate

        python3 - <<''PYCODE''

        from pathlib import Path

        import hashlib,subprocess

        name=''App/Ekitapligim/Support/Ekitapligim.entitlements''

        expected=subprocess.check_output([''git'',''show'',''5e8a245faf70dd977458f9fefc498b61d1f38f54:''+name])

        Path(name).write_bytes(expected)

        print(''Restored reviewed production entitlements SHA256:'',hashlib.sha256(expected).hexdigest())

        PYCODE

        '
    - name: Run complete Core suite including live audio header regressions
      script: bash Scripts/testflight-audio-core-regression.sh
    - name: Prepare existing app signing capabilities and App Store profile
      script: "set -euo pipefail\nBUNDLE_ID=\"com.ekitapligim.app\"\nSIGNING_DIR=\"$CM_BUILD_DIR/build/push-signing\"\nmkdir -p \"$SIGNING_DIR/profiles\"\nBUNDLE_IDS_JSON=$(app-store-connect bundle-ids list \\\n  --bundle-id-identifier \"$BUNDLE_ID\" \\\n  --strict-match-identifier \\\n  --json)\nBUNDLE_RESOURCE_ID=$(printf '%s' \"$BUNDLE_IDS_JSON\" | jq -r --arg identifier \"$BUNDLE_ID\" '\n  (if type == \"array\" then . else (.data // [.] ) end)\n  | map(select((.attributes.identifier // .identifier) == $identifier))\n  | first\n  | .id // empty\n')\nif [ -z \"$BUNDLE_RESOURCE_ID\" ]; then\n  echo \"Could not resolve Apple bundle ID resource for $BUNDLE_ID\"\n  exit 1\nfi\nCAPABILITIES_JSON=$(app-store-connect bundle-ids capabilities \"$BUNDLE_RESOURCE_ID\" --json)\nif ! printf '%s' \"$CAPABILITIES_JSON\" | grep -Eq 'PUSH_NOTIFICATIONS|Push Notifications'; then\n  app-store-connect bundle-ids enable-capabilities \\\n    \"$BUNDLE_RESOURCE_ID\" \\\n    --capability \"Push Notifications\"\
        \nfi\nif ! printf '%s' \"$CAPABILITIES_JSON\" | grep -Eq 'ASSOCIATED_DOMAINS|Associated Domains'; then\n  app-store-connect bundle-ids enable-capabilities \"$BUNDLE_RESOURCE_ID\" --capability \"Associated Domains\"\nfi\nCURRENT_CAPABILITIES_JSON=$(app-store-connect bundle-ids capabilities \"$BUNDLE_RESOURCE_ID\" --json)\nprintf '%s' \"$CURRENT_CAPABILITIES_JSON\" | grep -Eq 'PUSH_NOTIFICATIONS|Push Notifications'\nprintf '%s' \"$CURRENT_CAPABILITIES_JSON\" | grep -Eq 'ASSOCIATED_DOMAINS|Associated Domains'\nCERTIFICATES_JSON=$(app-store-connect certificates list \\\n  --profile-type IOS_APP_STORE \\\n  --json)\nCERTIFICATE_RESOURCE_IDS=()\nwhile IFS= read -r CERTIFICATE_RESOURCE_ID; do\n  if [ -n \"$CERTIFICATE_RESOURCE_ID\" ]; then\n    CERTIFICATE_RESOURCE_IDS+=(\"$CERTIFICATE_RESOURCE_ID\")\n  fi\ndone < <(printf '%s' \"$CERTIFICATES_JSON\" | jq -r '\n  (if type == \"array\" then . else (.data // [.] ) end)\n  | map(.id // empty)\n  | .[]\n')\nif [ \"${#CERTIFICATE_RESOURCE_IDS[@]}\"\
        \ -eq 0 ]; then\n  echo \"Could not resolve an Apple Distribution certificate for App Store signing\"\n  exit 1\nfi\nPROFILE_NAME=\"Ekitapligim App Store Push ${CM_BUILD_ID}\"\napp-store-connect profiles create \"$BUNDLE_RESOURCE_ID\" \\\n  --certificate-ids \"${CERTIFICATE_RESOURCE_IDS[@]}\" \\\n  --type IOS_APP_STORE \\\n  --name \"$PROFILE_NAME\" \\\n  --save \\\n  --profiles-dir \"$SIGNING_DIR/profiles\"\n"
    - name: Configure App Store code signing
      script: "set -euo pipefail\nmkdir -p \"$CM_BUILD_DIR/build\"\nXCODE_PROFILES_DIR=\"$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles\"\nLEGACY_PROFILES_DIR=\"$HOME/Library/MobileDevice/Provisioning Profiles\"\nmkdir -p \"$XCODE_PROFILES_DIR\" \"$LEGACY_PROFILES_DIR\"\ncp \"$CM_BUILD_DIR\"/build/push-signing/profiles/*.mobileprovision \"$XCODE_PROFILES_DIR/\"\ncp \"$CM_BUILD_DIR\"/build/push-signing/profiles/*.mobileprovision \"$LEGACY_PROFILES_DIR/\"\necho \"Available Apple signing identities:\"\nsecurity find-identity -v -p codesigning || true\nxcode-project use-profiles \\\n  --profile \"$CM_BUILD_DIR/build/push-signing/profiles/*.mobileprovision\" \\\n  --archive-method app-store 2>&1 | tee \"$CM_BUILD_DIR/build/configure-code-signing.log\"\n"
    - name: Resolve Swift Package dependencies
      script: 'xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

        '
    - name: Verify native AVFoundation metadata compatibility without starting audio output
      script: bash Scripts/testflight-audio-metadata-regression.sh
    - name: Verify Production Google Sign-In settings
      script: "set -euo pipefail\nSETTINGS_FILE=\"$CM_BUILD_DIR/build/production-build-settings.log\"\nmkdir -p \"$CM_BUILD_DIR/build\"\nxcodebuild -showBuildSettings \\\n  -project \"$XCODE_PROJECT\" \\\n  -scheme \"$XCODE_SCHEME\" \\\n  -configuration \"$XCODE_CONFIGURATION\" > \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = com\\.ekitapligim\\.app$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_IOS_CLIENT_ID = 258534406055-trcoiet648ohvijagtpli1h1556i2cjq\\.apps\\.googleusercontent\\.com$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_SERVER_CLIENT_ID = 258534406055-v8lmgd6moijakv1kcurgit788uk5v2el\\.apps\\.googleusercontent\\.com$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_GOOGLE_URL_SCHEME = com\\.googleusercontent\\.apps\\.258534406055-trcoiet648ohvijagtpli1h1556i2cjq$' \"$SETTINGS_FILE\"\ngrep -Eq '^[[:space:]]*EKITAPLIGIM_API_BASE_URL = https://ekitapligim\\.com/ios-api/v1/$' \"$SETTINGS_FILE\"\n"
    - name: Assign an unused increasing TestFlight build number
      script: "set -euo pipefail\nLATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \"$APP_STORE_APPLE_ID\" --platform IOS --all-versions)\nif ! [[ \"$LATEST_BUILD_NUMBER\" =~ ^[0-9]+$ ]]; then\n  echo \"Could not determine the current TestFlight build number.\"\n  exit 1\nfi\nLOCAL_BUILD_FLOOR=44\nif [ \"$LATEST_BUILD_NUMBER\" -lt \"$LOCAL_BUILD_FLOOR\" ]; then LATEST_BUILD_NUMBER=\"$LOCAL_BUILD_FLOOR\"; fi\nNEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))\nagvtool new-version -all \"$NEXT_BUILD_NUMBER\"\necho \"TESTFLIGHT_NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER\" >> \"$CM_ENV\"\necho \"TestFlight build number: $NEXT_BUILD_NUMBER\"\n"
    - name: Build IPA for TestFlight
      script: "set -euo pipefail\nxcode-project build-ipa \\\n  --project \"$CM_BUILD_DIR/$XCODE_PROJECT\" \\\n  --scheme \"$XCODE_SCHEME\" 2>&1 | tee \"$CM_BUILD_DIR/build/build-ipa.log\"\n"
    - name: Verify the actual signed TestFlight IPA
      script: python3 Scripts/verify-testflight-ipa.py
    artifacts:
    - build/ios/ipa/*.ipa
    - build/testflight-reviewed/*.json
    - build/testflight-reviewed/*.log
    - build/testflight-reviewed/*.xml
    - build/build-ipa.log
    - build/configure-code-signing.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
