name: Full release review (no publishing)
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/release-review-*'
permissions:
  contents: read
jobs:
  native:
    name: Review ${{ matrix.group }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [native-unit, iPhone-compact, iPhone-large, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select App Store compatible Xcode
        run: bash Scripts/select-ci-xcode.sh
      - name: Complete native review
        env:
          EKITAPLIGIM_FULL_RELEASE_REVIEW: '1'
          EKITAPLIGIM_REVIEW_GROUP: ${{ matrix.group }}
        run: |
          # Process names only: no environment values, tokens or command arguments.
          (
            while sleep 60; do
              date -u '+Review progress %Y-%m-%dT%H:%M:%SZ'
              ps -axo pid,ppid,pcpu,etime,comm | awk '/xcodebuild|codesign|swift-frontend|Simulator/ { print }' | tail -n 12
            done
          ) &
          review_monitor=$!
          trap 'kill "$review_monitor" 2>/dev/null || true' EXIT
          bash Scripts/modern-parity-macos-validation.sh
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-review-${{ matrix.group }}
          path: |
            build/modern-parity-archives/
            build/modern-parity-packaging.log
          if-no-files-found: warn
          retention-days: 14
  backend:
    name: Offline server contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test in Tests/Backend/*Test.php; do
            # This integration test needs an installed third-party server source.
            if [[ "$test" == *ReaderDriveSourceTest.php ]]; then continue; fi
            php "$test"
          done
          php Scripts/appstore-entitlement-policy-test.php
