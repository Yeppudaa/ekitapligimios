name: iOS Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  reader-contracts:
    name: Reader API and EPUB interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reader backend service and controller tests
        run: |
          php Tests/Backend/ReaderProgressTest.php
          php Tests/Backend/ReaderProgressControllerTest.php
          php Tests/Backend/MobileSessionRetryTest.php
      - name: Live-room chat interactions and notification isolation
        run: |
          php Tests/Backend/ChatInteractionTest.php
          php Tests/Backend/ChatInteractionPushTest.php
          php Tests/Backend/ChatControllerTest.php
          php Tests/Backend/ChatSerializerTest.php
      - name: App Store verification, restore and transaction ordering contracts
        run: |
          php Scripts/appstore-entitlement-policy-test.php
          php Tests/Backend/AppStoreEntitlementPolicyTest.php
          php Tests/Backend/AppStoreTransactionStoreTest.php
          php Tests/Backend/AppStoreControllerTest.php
          php Tests/Backend/AppStoreSignatureTest.php
          php Tests/Backend/AppStoreMembershipTest.php
          php Tests/Backend/AppStoreTermScheduleTest.php
          php Tests/Backend/AppStoreLegacyContractTest.php
          php Tests/Backend/AppStoreRenewableCatalogTest.php
          php Tests/Backend/PublicBearerIsolationTest.php
          php Tests/Backend/AccountDeletionRequestTest.php
          php Tests/Backend/AlertPrivacyTest.php
          php Tests/Backend/ApnsPushPolicyTest.php
          php Tests/Backend/ApnsDeliveryTest.php
          php Tests/Backend/MeDeviceTokenTest.php
          php Tests/Backend/ApnsTransportContractTest.php
      - name: EPUB.js and Readium position contract
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-test-runtime" jsdom@26.1.0 epubjs@0.3.93 --no-audit --no-fund
          node Tests/Reader/EPUBCFIBridgeTests.cjs "$RUNNER_TEMP/reader-test-runtime/node_modules"
  source-validation:
    name: Source validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workspace files
        shell: pwsh
        run: ./Scripts/validate-workspace.ps1
      - name: App Store preflight with development placeholders
        shell: pwsh
        run: ./Scripts/appstore-preflight.ps1 -AllowPlaceholders

  ios-build:
    name: iOS build and tests (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            destination: 'platform=iOS Simulator,name=iPhone 16,OS=latest'
            resultBundle: TestResults.xcresult
          - device: iPad
            destination: 'platform=iOS Simulator,name=iPad Air 11-inch (M3),OS=latest'
            resultBundle: TestResults-iPad.xcresult
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -version | grep -q 'Xcode 16.4'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify generated schemes and targets
        run: xcodebuild -project Ekitapligim.xcodeproj -list
      - name: Resolve pinned Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Ekitapligim.xcodeproj
          -scheme Ekitapligim
          -clonedSourcePackagesDirPath .build/xcode-packages
      - name: Verify Readium resolution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("Ekitapligim.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")
          data = json.loads(path.read_text())
          pins = data.get("pins", data.get("object", {}).get("pins", []))
          readium = next((pin for pin in pins if pin.get("identity") == "swift-toolkit" or pin.get("package") == "swift-toolkit"), None)
          assert readium is not None, "Readium pin missing"
          state = readium.get("state", readium.get("repositoryURL", {}))
          assert state.get("revision") == "de07026e9f825a5791f27a7ac4cd6bb1a784ab8d", f"Unexpected Readium revision: {state}"
          print("Readium 3.9.0 resolved at its immutable release commit from Package.resolved")
          PY
      - name: Swift package tests
        run: swift test
      - name: ${{ matrix.device }} simulator unit and UI tests
        run: >-
          xcodebuild test
          -project Ekitapligim.xcodeproj
          -scheme Ekitapligim
          -configuration Development
          -destination '${{ matrix.destination }}'
          -resultBundlePath ${{ matrix.resultBundle }}
          -clonedSourcePackagesDirPath .build/xcode-packages
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/Scripts/ci-simulator.entitlements"
      - name: Production unsigned build
        if: matrix.device == 'iPhone'
        run: >-
          xcodebuild clean build
          -project Ekitapligim.xcodeproj
          -scheme Ekitapligim
          -configuration Production
          -destination generic/platform=iOS
          -derivedDataPath build
          -clonedSourcePackagesDirPath .build/xcode-packages
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
      - name: Verify Production Google Sign-In plist values
        if: matrix.device == 'iPhone'
        run: |
          APP_PLIST="$(find "$PWD/build/Build/Products" -path '*/Ekitapligim.app/Info.plist' | head -n 1)"
          if [ -z "$APP_PLIST" ]; then
            echo "Built app Info.plist not found"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :GIDClientID' "$APP_PLIST" | grep -q 'apps.googleusercontent.com'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP_PLIST" | grep -q 'com.googleusercontent.apps.'
          echo "Resolved Google Sign-In values found in $APP_PLIST"
      - name: Export simulator screenshot attachments
        if: always()
        run: |
          mkdir -p AISimulatorEvidence/iPhone AISimulatorEvidence/iPad
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path AISimulatorEvidence/iPhone
          fi
          if [ -d TestResults-iPad.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults-iPad.xcresult --output-path AISimulatorEvidence/iPad
          fi
      - name: Upload simulator screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-simulator-evidence-${{ matrix.device }}
          path: AISimulatorEvidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.device }}-test-results
          path: ${{ matrix.resultBundle }}
          if-no-files-found: warn
          retention-days: 14
      - name: Upload resolved package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-package-resolution-${{ matrix.device }}
          path: Ekitapligim.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 14

  app-store-screenshots:
    name: Accurate App Store screenshots
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve pinned Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Ekitapligim.xcodeproj
          -scheme Ekitapligim
          -clonedSourcePackagesDirPath .build/xcode-packages
      - name: Capture App Store iPhone screenshots
        run: >-
          xcodebuild test
          -project Ekitapligim.xcodeproj
          -scheme Ekitapligim
          -configuration Development
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=latest'
          -only-testing:EkitapligimUITests/EkitapligimUITests/testCaptureAppStoreScreenshots
          -resultBundlePath AppStoreScreenshots-iPhone.xcresult
          -clonedSourcePackagesDirPath .build/xcode-packages
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
      - name: Capture App Store iPad screenshots
        run: >-
          xcodebuild test
          -project Ekitapligim.xcodeproj
          -scheme Ekitapligim
          -configuration Development
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=latest'
          -only-testing:EkitapligimUITests/EkitapligimUITests/testCaptureAppStoreScreenshots
          -resultBundlePath AppStoreScreenshots-iPad.xcresult
          -clonedSourcePackagesDirPath .build/xcode-packages
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
      - name: Export App Store screenshot attachments
        if: always()
        run: |
          mkdir -p AppStoreScreenshots/iPhone AppStoreScreenshots/iPad
          xcrun xcresulttool export attachments --path AppStoreScreenshots-iPhone.xcresult --output-path AppStoreScreenshots/iPhone
          xcrun xcresulttool export attachments --path AppStoreScreenshots-iPad.xcresult --output-path AppStoreScreenshots/iPad
      - name: Upload App Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: AppStoreScreenshots
          if-no-files-found: error
          retention-days: 14
